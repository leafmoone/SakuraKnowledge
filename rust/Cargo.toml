[package]
name = "sakura-knowledge-runtime"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Read-only Rust runtime for SakuraKnowledge snapshot queries"

[lib]
name = "sakura_knowledge_runtime"
path = "src/lib.rs"

[[bin]]
name = "sknow-rs"
path = "src/main.rs"

[[bin]]
name = "semantic-dependency-probe"
path = "src/bin/semantic_dependency_probe.rs"
required-features = ["semantic"]

[[bin]]
name = "semantic_pilot"
path = "src/bin/semantic_pilot.rs"
required-features = ["semantic"]

[features]
semantic = ["dep:ort", "dep:tokenizers", "dep:usearch"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "hooks", "limits"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-normalization = "0.1"
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
tokenizers = { version = "=0.22.2", optional = true, default-features = false, features = ["fancy-regex"] }
usearch = { version = "=2.26.2", optional = true }

[patch.crates-io]
usearch = { path = "../vendor/usearch-2.26.2" }
