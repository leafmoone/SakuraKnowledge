[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakura-knowledge"
version = "0.2.0"
description = "Offline evidence-preserving knowledge snapshot core"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sknow = "sakura_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
