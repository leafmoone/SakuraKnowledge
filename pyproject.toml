[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakura-knowledge"
version = "0.2.0"
description = "Offline evidence-preserving knowledge snapshot core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
semantic-cuda = [
    "numpy>=2,<3",
    "tokenizers==0.23.3",
    "transformers==5.20.2",
    "torch>=2.11,<2.14",
]

[project.scripts]
sknow = "sakura_knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
